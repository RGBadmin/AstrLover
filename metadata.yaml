desc: 拟真 AI 恋人——相册检索、发照片生图、频道动态、头像签名、表情回应、图片记忆、导演控制台，外加人格档案、四层记忆、作息日程与意愿驱动的主动消息。
help: |
  全部能力注册为 LLM 工具，由角色自己决定何时使用；每项都有手动指令入口。
  她是谁写在 AstrBot 的人格设定里，聊天记录用 AstrBot 的对话管理。
  接线（恋人 id / 导演 bot / Provider）在插件配置页，其余设置与记录在插件面板。
